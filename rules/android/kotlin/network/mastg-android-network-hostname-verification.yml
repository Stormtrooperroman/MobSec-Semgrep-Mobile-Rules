rules:
  - id: mastg-android-network-hostname-verification
    severity: INFO
    languages:
      - kotlin
    metadata:
      summary: This rule looks for the use of HostnameVerifier in the app
    message: Improper server hostname verification detected
    match:
      any:
        - HostnameVerifier() {...}
        - HostnameVerifier {...}
        - HostnameVerifier(...) {...}
        - HostnameVerifier(...)
        - $HOSTNAMEVERIFIER = HostnameVerifier {...}
        - $HOSTNAMEVERIFIER = HostnameVerifier(...) {...}
        - $HOSTNAMEVERIFIER = HostnameVerifier(...)